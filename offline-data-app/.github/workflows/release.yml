name: Build & Release

# Triggers when you push a version tag from your Linux machine:
#   python bump_version.py patch --commit
#   git push && git push origin vX.Y.Z
# or use the one-command helper:
#   ./release.sh patch "changelog message"

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

jobs:
  build-and-release:
    name: Build Windows Installer & Publish Release
    runs-on: windows-latest

    steps:
      # -------------------------------------------------------
      # 1. Checkout
      # -------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so git log changelog works

      # -------------------------------------------------------
      # 2. Read version from version.json
      # -------------------------------------------------------
      - name: Read version
        id: version
        shell: python
        run: |
          import json, os
          data = json.loads(open("version.json").read())
          v = data["version"]
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"version={v}\n")
              f.write(f"tag=v{v}\n")
              f.write(f"installer=installer_output/SOCDataProcessor-Setup-{v}.exe\n")

      # -------------------------------------------------------
      # 3. Set up Python
      # -------------------------------------------------------
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # -------------------------------------------------------
      # 4. Install Python dependencies
      # -------------------------------------------------------
      - name: Install dependencies
        shell: cmd
        run: pip install -r requirements.txt --quiet

      # -------------------------------------------------------
      # 5. Build with PyInstaller
      # -------------------------------------------------------
      - name: Build with PyInstaller
        shell: cmd
        run: pyinstaller app.spec --noconfirm

      # -------------------------------------------------------
      # 6. Install Inno Setup
      # -------------------------------------------------------
      - name: Install Inno Setup
        shell: powershell
        run: |
          $url = "https://jrsoftware.org/download.php/is.exe"
          Invoke-WebRequest -Uri $url -OutFile "$env:TEMP\innosetup.exe"
          Start-Process -FilePath "$env:TEMP\innosetup.exe" -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART" -Wait

      # -------------------------------------------------------
      # 7. Build installer with Inno Setup
      # -------------------------------------------------------
      - name: Build Windows installer
        shell: cmd
        run: |
          if not exist installer_output mkdir installer_output
          echo #define MyAppVersion "${{ steps.version.outputs.version }}" > version.iss
          "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss
          if errorlevel 1 exit /b 1

      # -------------------------------------------------------
      # 8. Compute SHA256
      # -------------------------------------------------------
      - name: Compute SHA256
        id: sha256
        shell: python
        run: |
          import hashlib, os
          path = r"${{ steps.version.outputs.installer }}"
          digest = hashlib.sha256(open(path, "rb").read()).hexdigest()
          size = os.path.getsize(path)
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"hash={digest}\n")
              f.write(f"size={size}\n")

      # -------------------------------------------------------
      # 9. Auto-generate changelog from git log
      # -------------------------------------------------------
      - name: Generate changelog
        id: changelog
        shell: python
        run: |
          import subprocess, os, textwrap

          tag = "${{ steps.version.outputs.tag }}"
          version = "${{ steps.version.outputs.version }}"
          sha256 = "${{ steps.sha256.outputs.hash }}"
          size = "${{ steps.sha256.outputs.size }}"

          # Find previous tag
          prev = subprocess.run(
              ["git", "describe", "--tags", "--abbrev=0", f"{tag}^"],
              capture_output=True, text=True
          ).stdout.strip()

          git_range = f"{prev}..{tag}" if prev else "HEAD"

          commits = subprocess.run(
              ["git", "log", git_range, "--pretty=format:- %s", "--no-merges"],
              capture_output=True, text=True
          ).stdout.strip()

          if not commits:
              commits = "- Minor improvements and bug fixes"

          body = textwrap.dedent(f"""
          ## SOC Data Processor {tag}

          ### Changes
          {commits}

          ### Installation
          Download `SOCDataProcessor-Setup-{version}.exe` below and run it.
          If you have a previous version installed, it will be upgraded automatically.

          ### Verification
          SHA256: `{sha256}`
          Size: {int(size):,} bytes
          """).strip()

          # Write to file so the release step can read it
          with open("RELEASE_NOTES.md", "w", encoding="utf-8") as f:
              f.write(body)

          print(body)

      # -------------------------------------------------------
      # 10. Create GitHub Release and upload installer
      # -------------------------------------------------------
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: SOC Data Processor ${{ steps.version.outputs.tag }}
          body_path: RELEASE_NOTES.md
          files: ${{ steps.version.outputs.installer }}
          fail_on_unmatched_files: true
